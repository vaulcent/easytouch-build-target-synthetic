[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic_build_target_app"
version = "0.0.1"
requires-python = ">=3.12"

# Explicit package list (rather than setuptools auto-discovery) so the
# built/installed distribution always contains both the app package
# (hooks.py, modules.txt, fixtures/) and its nested module package,
# regardless of which directory `pip`/`bench` happens to be invoked
# from. Auto-discovery silently dropping a package, or package-data
# globs being omitted, is exactly what previously caused
# fixtures/custom_field.json to be present in source but absent from
# the installed site-packages copy (FIXTURE_VERIFY_FAILED), which in
# turn made `bench migrate` never import the Custom Field and made the
# metadata/behavior checks that depend on it fail as well.
[tool.setuptools]
packages = [
    "synthetic_build_target_app",
    "synthetic_build_target_app.synthetic_build_target_app",
]
include-package-data = true

# package-data is respected for wheel builds directly by setuptools
# (independent of MANIFEST.in), so this guarantees fixtures/*.json and
# modules.txt are packaged into the installed distribution every time,
# not only when building an sdist.
[tool.setuptools.package-data]
synthetic_build_target_app = ["fixtures/*.json", "modules.txt"]
