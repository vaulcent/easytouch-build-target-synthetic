[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-build-target-app"
version = "0.0.1"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_build_target_app", "synthetic_build_target_app.*"]

[tool.setuptools.package-data]
"synthetic_build_target_app" = ["fixtures/*.json", "modules.txt"]
