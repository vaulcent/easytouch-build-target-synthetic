[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-build-target-app"
version = "0.0.1"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_build_target_app*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
synthetic_build_target_app = ["fixtures/*.json", "modules.txt"]
