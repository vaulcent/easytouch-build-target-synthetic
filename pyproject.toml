[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-build-target-app"
version = "0.0.1"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_build_target_app*"]

[tool.setuptools]
include-package-data = true

# Frappe apps rely on non-Python data files (fixtures/*.json, modules.txt) being
# bundled into the installed package so `bench migrate` can import them. Without
# an explicit package-data declaration, setuptools only ships *.py files and the
# fixtures directory is silently dropped from the built/installed package, which
# is why `bench migrate` could not find custom_field.json at all.
[tool.setuptools.package-data]
synthetic_build_target_app = ["fixtures/*.json", "modules.txt"]
